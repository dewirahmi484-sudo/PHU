<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Pesan - Single File</title>
    <style>
        /* Desain Tampilan (CSS) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f9f9f9; 
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        input[type="text"] { 
            width: 70%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 16px;
        }
        button { 
            padding: 10px 15px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background-color: #218838; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { 
            background: #e9ecef; 
            margin: 10px 0; 
            padding: 12px; 
            border-radius: 4px; 
            text-align: left; 
            display: flex;
            justify-content: space-between;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <!-- Struktur Tampilan (HTML) -->
    <div class="container">
        <h1>Papan Pesan</h1>
        
        <div>
            <input type="text" id="messageInput" placeholder="Ketik pesan Anda di sini..." onkeypress="handleEnter(event)" />
            <button onclick="tambahPesan()">Kirim</button>
        </div>

        <ul id="messageList">
            <!-- Daftar pesan akan dirender oleh JavaScript di sini -->
        </ul>
    </div>

    <!-- Logika Program (JavaScript) -->
    <script>
        // Mengambil data dari Local Storage browser, atau buat array default jika kosong
        let dbPesan = JSON.parse(localStorage.getItem('pesanTersimpan')) || [
            { id: 1, text: "Halo! Ini pesan contoh. Coba tambahkan pesan baru." }
        ];

        // Fungsi untuk menampilkan pesan ke layar
        function renderPesan() {
            const listElement = document.getElementById('messageList');
            listElement.innerHTML = ''; // Kosongkan daftar sebelum menggambar ulang

            dbPesan.forEach(pesan => {
                const li = document.createElement('li');
                
                // Teks pesan
                const spanText = document.createElement('span');
                spanText.textContent = pesan.text;
                
                // Tombol hapus (tambahan fitur)
                const btnHapus = document.createElement('button');
                btnHapus.textContent = 'Hapus';
                btnHapus.className = 'delete-btn';
                btnHapus.onclick = () => hapusPesan(pesan.id);

                li.appendChild(spanText);
                li.appendChild(btnHapus);
                listElement.appendChild(li);
            });
        }

        // Fungsi untuk menambahkan pesan baru
        function tambahPesan() {
            const input = document.getElementById('messageInput');
            const teksPesan = input.value;

            // Validasi jika input kosong
            if (teksPesan.trim() === '') {
                alert('Pesan tidak boleh kosong!');
                return;
            }

            // Tambahkan data ke array
            const pesanBaru = {
                id: Date.now(), // Gunakan waktu saat ini sebagai ID unik
                text: teksPesan
            };
            dbPesan.push(pesanBaru);

            // Simpan ke Local Storage dan perbarui tampilan
            simpanKeStorage();
            input.value = ''; 
            renderPesan(); 
        }

        // Fungsi untuk menghapus pesan
        function hapusPesan(id) {
            // Saring array, buang pesan dengan ID yang cocok
            dbPesan = dbPesan.filter(pesan => pesan.id !== id);
            
            simpanKeStorage();
            renderPesan();
        }

        // Fungsi pembantu untuk menyimpan data ke Local Storage
        function simpanKeStorage() {
            localStorage.setItem('pesanTersimpan', JSON.stringify(dbPesan));
        }

        // Fungsi agar bisa menekan "Enter" pada keyboard untuk mengirim
        function handleEnter(event) {
            if (event.key === 'Enter') {
                tambahPesan();
            }
        }

        // Tampilkan pesan pertama kali saat halaman dibuka
        renderPesan();
    </script>
</body>
</html>
